apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard7-api
  labels: &id001
    app: taskboard7-api
    app.kubernetes.io/name: taskboard7-api
    app.kubernetes.io/part-of: taskboard7
    app.kubernetes.io/managed-by: gitops-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskboard7-api
  template:
    metadata:
      labels: *id001
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app
        image: ghcr.io/ika100-demo/taskboard7-api
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: LOG_LEVEL
          value: INFO
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector:4318
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: http/protobuf
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=taskboard7,deployment.environment=dev
        - name: OTEL_SDK_DISABLED
          value: 'false'
        - name: OTEL_SERVICE_NAME
          value: taskboard7-api
        - name: PORT
          value: '8080'
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 3
          failureThreshold: 40
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 5
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          runAsUser: 10001
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
